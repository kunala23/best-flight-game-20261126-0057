<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Merapi Courier — a flight game</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #0b1526;
    overflow: hidden;
  }
  #stage {
    display: block;
    width: 100vw;
    height: 100vh;
    cursor: crosshair;
  }
  #fallback {
    position: fixed;
    left: 12px;
    bottom: 10px;
    color: #cfe3ff;
    font: 13px/1.4 system-ui, sans-serif;
    opacity: 0.75;
    user-select: none;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="stage" width="1280" height="800"></canvas>
<script type="module" src="./src/main.js"></script>
</body>
</html>
